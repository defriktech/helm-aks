apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: devops-ingress
  namespace: production

  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod

spec:
  ingressClassName: nginx

  tls:
  - hosts:
    - devops-app.local

    secretName: devops-tls

  rules:
  - host: devops-app.local

    http:
      paths:
      - path: /
        pathType: Prefix

        backend:
          service:
            name: devops-service
            port:
              number: 80
